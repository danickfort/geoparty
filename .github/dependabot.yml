version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy/github-runner
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3

    groups:
      docker-compose:
        patterns: ["*"]
      docker-compose-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
