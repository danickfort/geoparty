name: Test, publish and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE: danickfort/geoparty:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and test
        run: docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/krabilousse/geoparty" -t "$IMAGE" .
      - name: Publish tested image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login docker.io --username "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE"
          ref=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, geoparty-deploy]
    timeout-minutes: 15
    steps:
      - name: Request fixed NAS deployment
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          python3 -c 'import json,os; print(json.dumps({"digest":os.environ["IMAGE_DIGEST"],"sha":os.environ["GITHUB_SHA"]}))' > "$RUNNER_TEMP/deployment.json"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=/run/deploy/known_hosts -o ServerAliveInterval=30 \
            -i /run/deploy/key -p 2222 danick@192.168.1.60 < "$RUNNER_TEMP/deployment.json"
