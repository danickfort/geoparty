name: Publish Docker image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate on pushes to main — pull requests build but never push.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: danickfort/geoparty
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Push only on push to main; PRs run the build as a validation check.
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs on the self-hosted runner on the NAS. Never on pull requests, and only
  # after the image is published. No checkout — it just pulls the trusted image
  # and recreates the container, so untrusted PR code never touches the NAS.
  deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: [self-hosted, nas]
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull the freshly published image
        run: docker pull danickfort/geoparty:latest

      - name: Recreate the geoparty container
        run: |
          docker stop geoparty || true
          docker rm geoparty || true
          docker run -d \
            --name geoparty \
            --restart unless-stopped \
            -p 13385:3000 \
            -v /volume1/docker/geoparty/geoparty/data:/app/data \
            -v /volume1/docker/geoparty/geoparty/uploads:/app/uploads \
            -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            -e SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
            danickfort/geoparty:latest

      - name: Prune old images
        run: docker image prune -f
