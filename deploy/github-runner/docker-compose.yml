# Install the fixed NAS deployment command and this runner before merging the workflow.
services:
  runner:
    image: myoung34/github-runner@sha256:ecfd932558edcad8a34bba439a142eba46744a4a29cbf57ecfe5f1526332604d
    container_name: github-runner-geoparty
    restart: unless-stopped
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    environment:
      REPO_URL: https://github.com/krabilousse/geoparty
      RUNNER_NAME: nas-geoparty
      RUNNER_SCOPE: repo
      RUNNER_TOKEN: ${RUNNER_REGISTRATION_TOKEN:-}
      LABELS: geoparty-deploy
      RUNNER_WORKDIR: /tmp/runner/work
      RUN_AS_ROOT: "true"
      DISABLE_AUTO_UPDATE: "true"
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/config
    volumes:
      - runner-work:/tmp/runner
      - runner-config:/runner/config
      - /volume1/nas-control/runner-keys/geoparty:/run/deploy:ro
volumes:
  runner-work:
  runner-config:
